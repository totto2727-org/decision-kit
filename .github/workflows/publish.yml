name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          dev-shell: ci
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
      - name: Build npm artifact
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#ci")"
          vp run build
      - uses: totto2727-org/monorepo/.github/actions/publish-npm@main
        with:
          dev-shell: ci
          working-directory: .
          filters: '@totto2727/decision-kit'

  mooncakes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          dev-shell: moonbit-ci
      - uses: totto2727-org/monorepo/.github/actions/publish-moonbit@main
        with:
          dev-shell: moonbit-ci
          package-path: moonbit
          token: ${{ secrets.MOONCAKES_TOKEN }}
